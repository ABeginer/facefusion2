[paths]
temp_path = /tmp/facefusion
jobs_path = /tmp/facefusion-jobs

[processors]
processors = face_swapper expression_restorer

[face_swapper]
face_swapper_model = inswapper_128_fp16
face_swapper_pixel_boost = 256x256
face_swapper_weight = 1.0

[expression_restorer]
expression_restorer_model = live_portrait
expression_restorer_factor = 70
expression_restorer_areas = upper-face lower-face

[face_detector]
face_detector_model = scrfd
face_detector_size = 640x640
face_detector_angles = 0
face_detector_score = 0.35

[face_landmarker]
face_landmarker_model = 2dfan4
face_landmarker_score = 0.35

[face_selector]
face_selector_mode = reference
reference_face_distance = 0.55
face_tracker_score = 0.25

[face_masker]
face_mask_types = box
face_mask_blur = 0.45

[workflow]
workflow_strategy = memory
temp_frame_format = jpeg

[execution]
execution_device_ids = 0
execution_providers = cuda
execution_thread_count = 4
video_memory_strategy = tolerant

[output_creation]
output_video_encoder = libx264
output_video_preset = ultrafast
output_video_quality = 85
